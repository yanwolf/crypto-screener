const gate = {

  chain: Promise.resolve()
};
function buildUrl(path, {
  key,
  pro,
  proxy,
  local

  if (local) return "/api/v3" + path;
  const base = pro ? "https://pro-api.coingecko.com/api/v3" : "https://api.coingecko.com/api/v3";
  let url = base + path;
  if (key) url += (url.includes("?") ? "&" : "?") + (pro ? "x_cg_pro_api_key=" : "x_cg_demo_api_key=") + encodeURIComponent(key.trim());
  return proxy ? proxy.replace(/\/$/, "") + "/" + url : url;
}
function enqueue(fn, minGap) {
  const run = gate.chain.then(async () => {
    const wait = Math.max(0, gate.last + minGap - Date.now());
    if (wait) await sleep(wait);
    gate.last = Date.now();
    return fn();
  });
  gate.chain = run.catch(() => {});
  return run;
}
async function cgFetch(path, cfg) {
  const minGap = cfg.local ? 250 : cfg.key ? 900 : 2400;
  return enqueue(async () => {
    for (let attempt = 0; attempt < 3; attempt++) {
      let res;
      const ac = typeof AbortController !== "undefined" ? new AbortController() : null;
      const tid = ac ? setTimeout(() => ac.abort(), 25000) : null; // 單次請求上限 25 秒
      try {
        res = await fetch(buildUrl(path, cfg), {
          method: "GET",
          mode: "cors",
          cache: "no-store",
          signal: ac ? ac.signal : undefined
        });
      } catch (e) {
        if (tid) clearTimeout(tid);
        throw new Error(e && e.name === "AbortError" ? "TIMEOUT" : "BLOCKED");
      }
      if (tid) clearTimeout(tid);
      if (res.status === 429) {
        if (attempt < 2) {
          await sleep(6000 * (attempt + 1));
          continue;
        }
        throw new Error("RATE");
      }
      if (res.status === 401 || res.status === 403) throw new Error("AUTH");
      if (res.status === 404 && cfg.local && !res.headers.get("X-Cache")) throw new Error("NOPROXY");
      if (res.status >= 500) {
        if (attempt < 2) {
          await sleep(2500);
          continue;
        }
        throw new Error("SERVER");

      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }

}

function makeDemo() {
  let seed = 20260809;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
  const N = 90 * 6,
    step = 4 * 3600 * 1000,
    t0 = Date.now() - N * step;
  const coins = [],
    scans = {};
  DEMO_SEED.forEach(([id, sym, name, price, mcap], i) => {
    // 五種走勢型態，讓多空兩張雷達都有素材
    const regime = ["bull", "surge", "accel", "rebound", "range"][i % 5];
    const path = [],
      vmul = [];
    let p = 1;
    for (let k = 0; k < N; k++) {
      const f = k / N;
      let drift = 0.0001,
        vm = 0.6 + rnd() * 0.5;
      // 爆量只發生在最後一天，否則 7 日基準量會被自己墊高
      if (regime === "bull") {
        drift = 0.0009;
        if (f > 0.985) vm *= 1.9;
      } else if (regime === "surge") {
        drift = f > 0.985 ? 0.02 : 0.0003;
        if (f > 0.985) vm *= 3.6;
      } else if (regime === "accel") {
        drift = f < 0.45 ? 0.0006 : -0.0019;
        if (f > 0.45) vm *= 1.7;
      } else if (regime === "rebound") {
        drift = f < 0.4 ? 0.0005 : f < 0.82 ? -0.0023 : 0.0017;
        vm *= f >= 0.4 && f < 0.82 ? 1.8 : f >= 0.82 ? 0.5 : 1; // 跌時量增、彈時量縮
      }
      p *= 1 + drift + (rnd() - 0.5) * 0.016;
      path.push(p);
      vmul.push(vm);
    }
    const scale = price / path[N - 1];
    const prices = path.map((v, k) => [t0 + k * step, v * scale]);
    const vBase = mcap * (0.015 + rnd() * 0.1);
    const total_volumes = vmul.map((v, k) => [t0 + k * step, vBase * v]);
    const ret = back => (path[N - 1] / path[Math.max(0, N - 1 - back)] - 1) * 100;
    const curVol = total_volumes[N - 1][1];
    const athP = Math.max(...path) * scale * (1 + rnd() * 1.8);
    coins.push({
      id,
      symbol: sym,
      name,
      image: null,
      current_price: price,
      market_cap_rank: i + 1,
      market_cap: mcap,

    });
    scans[id] = extractScan({
      prices,
      total_volumes
    }, curVol);
  });
  return {
    coins,
    scans
  };
}

};
const fmtPrice = v => {

const fmtPct = (v, d = 1) => v == null || !isFinite(v) ? "—" : (v > 0 ? "+" : "") + v.toFixed(d) + "%";
const fmtX = v => v == null ? "—" : v.toFixed(2) + "x";
function pctRank(values) {
  const pairs = [];
  values.forEach((v, i) => {
    if (v != null && isFinite(v)) pairs.push([v, i]);
  });
  pairs.sort((a, b) => a[0] - b[0]);
  const out = new Array(values.length).fill(null);
  const n = pairs.length;
  pairs.forEach(([, i], r) => {
    out[i] = n <= 1 ? 50 : r / (n - 1) * 100;
  });
  return out;
}
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const stdev = a => {
  if (a.length < 2) return 0;
  const m = mean(a);
  return Math.sqrt(a.reduce((s, v) => s + (v - m) ** 2, 0) / (a.length - 1));
};

/* ════ 技術分析工具 ══════════════════════════════════════ */
/* 用逐時價格重建日線 OHLC，才有辦法做樞紐點、實體強弱與 ATR */
function toDaily(chart) {
  const days = new Map();
  (chart.prices || []).forEach(([t, p]) => {
    if (!isFinite(p)) return;
    const d = Math.floor(t / 86400000);
    const o = days.get(d);
    if (!o) days.set(d, {
      d,
      o: p,
      h: p,
      l: p,
      c: p,
      v: 0
    });else {
      o.h = Math.max(o.h, p);
      o.l = Math.min(o.l, p);
      o.c = p;
    }
  });
  (chart.total_volumes || []).forEach(([t, v]) => {
    const o = days.get(Math.floor(t / 86400000));
    if (o && isFinite(v)) o.v = v; // 當日最後一筆 24 小時滾動量
  });
  return [...days.values()].sort((a, b) => a.d - b.d);
}
function emaLast(arr, n) {
  if (!arr.length) return null;
  const k = 2 / (n + 1);
  let e = arr[0];
  for (let i = 1; i < arr.length; i++) e = arr[i] * k + e * (1 - k);
  return e;
}
function rsiLast(c, n = 14) {
  if (c.length < n + 2) return 50;
  let g = 0,
    l = 0;
  for (let i = 1; i <= n; i++) {
    const d = c[i] - c[i - 1];
    d >= 0 ? g += d : l -= d;
  }
  g /= n;
  l /= n;
  for (let i = n + 1; i < c.length; i++) {
    const d = c[i] - c[i - 1];
    g = (g * (n - 1) + Math.max(d, 0)) / n;
    l = (l * (n - 1) + Math.max(-d, 0)) / n;
  }
  return l === 0 ? 100 : 100 - 100 / (1 + g / l);
}
function atrLast(bars, n = 14) {
  if (bars.length < n + 1) return null;
  const tr = [];
  for (let i = 1; i < bars.length; i++) {
    const b = bars[i],
      p = bars[i - 1].c;
    tr.push(Math.max(b.h - b.l, Math.abs(b.h - p), Math.abs(b.l - p)));
  }
  return mean(tr.slice(-n));
}
/* 樞紐高低點：左右各 k 根都不超過自己 */
function pivots(bars, k = 3) {
  const hi = [],
    lo = [];
  for (let i = k; i < bars.length - k; i++) {
    let isH = true,
      isL = true;
    for (let j = i - k; j <= i + k; j++) {
      if (bars[j].h > bars[i].h) isH = false;
      if (bars[j].l < bars[i].l) isL = false;
    }
    if (isH) hi.push(i);
    if (isL) lo.push(i);
  }
  return {
    hi,
    lo
  };
}

/* 逐時價格 → 60 分 K 收盤序列 */
function toHourly(chart) {
  const m = new Map();
  (chart.prices || []).forEach(([t, p]) => {
    if (p != null) m.set(Math.floor(t / 3600000), p);
  });
  return [...m.entries()].sort((a, b) => a[0] - b[0]).map(x => x[1]);
}
function smaAt(a, n, back = 0) {
  const end = a.length - back;
  if (end < n) return null;
  let s = 0;
  for (let i = end - n; i < end; i++) s += a[i];
  return s / n;
}
function blades(chart) {
  const H = toHourly(chart);
  if (H.length < 250) return {}; // 240MA 至少要 240 根 60 分 K
  const price = H[H.length - 1];
  const ma20 = smaAt(H, 20),
    ma60 = smaAt(H, 60),
    ma240 = smaAt(H, 240);
  const ma20b = smaAt(H, 20, 3),
    ma60b = smaAt(H, 60, 6),
    ma240b = smaAt(H, 240, 12);
  const slope20 = ma20b ? (ma20 - ma20b) / ma20b * 100 : 0; // 近 3 根的斜率
  const slope60 = ma60b ? (ma60 - ma60b) / ma60b * 100 : 0;
  const slope240 = ma240b ? (ma240 - ma240b) / ma240b * 100 : 0;
  const aboveOrange = price > ma240,
    aboveGreen = price > ma60;
  const state = aboveOrange && aboveGreen ? slope20 >= 0 ? "attackLong" : "takeLong" : aboveOrange && !aboveGreen ? "correction" : !aboveOrange && aboveGreen ? "rebound" : slope20 <= 0 ? "attackShort" : "coverShort";
  return {
    ma20,
    ma60,
    ma240,
    slope20,
    slope60,
    slope240,
    bladeState: state,
    dGreen: (price / ma60 - 1) * 100,
    dOrange: (price / ma240 - 1) * 100,
    dBlue: (price / ma20 - 1) * 100,
    // 小綠與小橘距離太近代表均線糾結，這種盤三刀流勝率會下降
    tangle: Math.abs(ma60 - ma240) / price * 100 < 0.6
  };
}

/* 趨勢結構：EMA、樞紐、下跌波段、回撤位置、分段量能 */
function structure(bars) {
  if (bars.length < 35) return {};
  const c = bars.map(b => b.c);
  const price = c[c.length - 1];
  const ema20 = emaLast(c, 20),
    ema50 = emaLast(c, 50);
  const rsi = rsiLast(c),
    atr = atrLast(bars);
  const {
    hi,
    lo
  } = pivots(bars, 3);
  const h2 = hi.slice(-2),
    l2 = lo.slice(-2);
  const lowerHigh = h2.length === 2 && bars[h2[1]].h < bars[h2[0]].h;
  const lowerLow = l2.length === 2 && bars[l2[1]].l < bars[l2[0]].l;

  /* 最近一段下跌：近 50 根內的最高點，以及其後的最低點 */
  const win = bars.slice(-50),
    off = bars.length - win.length;
  let hIdx = 0;
  win.forEach((b, i) => {
    if (b.h > win[hIdx].h) hIdx = i;
  });
  let lIdx = hIdx;
  for (let i = hIdx; i < win.length; i++) if (win[i].l < win[lIdx].l) lIdx = i;
  const swingHigh = win[hIdx].h,
    swingLow = win[lIdx].l;
  const range = swingHigh - swingLow;
  const drop = swingHigh > 0 ? (swingLow / swingHigh - 1) * 100 : 0;
  const bounce = swingLow > 0 ? (price / swingLow - 1) * 100 : 0;
  const retrace = range > 0 ? clamp((price - swingLow) / range, -0.2, 1.5) : 0;
  const fib = r => swingLow + r * range;

  /* 下跌段與反彈段的量能對比 */
  const downSeg = win.slice(hIdx, lIdx + 1),
    upSeg = win.slice(lIdx);
  const downVol = mean(downSeg.map(b => b.v)) || 1;
  const bounceVol = upSeg.length > 1 ? mean(upSeg.slice(1).map(b => b.v)) : null;
  const volRatio = bounceVol != null && downVol ? bounceVol / downVol : null;

  /* 反彈段陽線實體是否轉弱 */
  const ups = upSeg.filter(b => b.c > b.o && b.h > b.l).map(b => (b.c - b.o) / (b.h - b.l));
  const bodyFade = ups.length >= 4 ? mean(ups.slice(-2)) / (mean(ups.slice(0, 2)) || 1) : null;

  /* 支撐：下跌起點之前最後一個樞紐低點 */
  const prevLows = lo.filter(i => i < off + hIdx);
  const support = prevLows.length ? bars[prevLows[prevLows.length - 1]].l : Math.min(...bars.slice(Math.max(0, bars.length - 60), Math.max(1, bars.length - 20)).map(b => b.l));

  /* 壓力：現價之上最接近的一個 */
  const cands = [ema20, fib(0.5), fib(0.618), swingHigh, support].filter(v => v && v > price * 1.002);
  const resistance = cands.length ? Math.min(...cands) : swingHigh;
  const recentVol = mean(bars.slice(-3).map(b => b.v)) || 0;
  const baseVol = mean(bars.slice(-30, -3).map(b => b.v)) || 1;
  let downDays = 0;
  for (let i = c.length - 1; i > 0 && c[i] < c[i - 1]; i--) downDays++;
  return {
    ema20,
    ema50,
    rsi,
    atr,
    lowerHigh,
    lowerLow,
    swingHigh,
    swingLow,
    drop,
    bounce,
    retrace,
    fib50: fib(0.5),
    fib618: fib(0.618),
    fib786: fib(0.786),
    downVol,
    bounceVol,
    volRatio,
    bodyFade,
    support,
    brokeSupport: price < support,
    resistance,
    volExpand: recentVol / baseVol,
    downDays,
    bounceHigh: Math.max(...upSeg.map(b => b.h))
  };
}

/* ════ 從 market_chart 萃取量能特徵 ══════════════════════ */
function extractScan(chart, curVol) {
  const P = (chart.prices || []).map(r => r[1]).filter(isFinite);
  const V = (chart.total_volumes || []).map(r => r[1]).filter(isFinite);
  if (P.length < 48 || V.length < 48) return {
    err: true
  };
  const n = V.length,
    perDay = Math.max(1, Math.round(n / 90));
  const at = (arr, daysBack) => arr.slice(Math.max(0, arr.length - daysBack * perDay));
  const now = curVol != null && isFinite(curVol) ? curVol : V[n - 1];

  // 基準量刻意排除最近 24 小時，否則今天的爆量會把自己的基準墊高
  const prior = V.slice(0, Math.max(1, n - perDay));
  const base7 = mean(prior.slice(Math.max(0, prior.length - 7 * perDay))) || 1;
  const base30 = mean(prior.slice(Math.max(0, prior.length - 30 * perDay))) || 1;
  const daily = [];
  for (let i = perDay; i <= n; i += perDay) daily.push(V[i - 1]);
  const d30 = daily.slice(-30);
  const volCV = mean(d30) ? stdev(d30) / mean(d30) : 1;
  const sorted90 = [...V].sort((a, b) => a - b);
  const below = sorted90.filter(v => v <= now).length;
  const volPct = below / sorted90.length * 100;
  const priorP = P.slice(0, Math.max(1, P.length - perDay));
  const hi20 = Math.max(...priorP.slice(Math.max(0, priorP.length - 20 * perDay)));
  const price = P[P.length - 1];
  const dailyP = [];
  for (let i = perDay; i <= P.length; i += perDay) dailyP.push(P[i - 1]);
  const rets = [];
  for (let i = 1; i < dailyP.length; i++) if (dailyP[i - 1] > 0) rets.push(dailyP[i] / dailyP[i - 1] - 1);
  const vola = stdev(rets.slice(-30)) * Math.sqrt(365) * 100;
  return {
    ...structure(toDaily(chart)),
    ...blades(chart),
    base7,
    base30,
    rvol7: now / base7,
    rvol30: now / base30,
    volPct,
    volCV,
    h90: Math.max(...P),
    l90: Math.min(...P),
    brk20: price >= hi20,
    vola,
    volTrend: (mean(at(V, 3)) || 1) / (mean(V.slice(Math.max(0, n - 10 * perDay), Math.max(1, n - 3 * perDay))) || 1),
    ts: Date.now()
  };
}

/* ════ 雷達評分與白話解讀 ════════════════════════════════ */
function analyze(r, sc) {
  const o = {
    ...r,
    scanned: !!(sc && !sc.err)
  };
  if (!o.scanned) return {
    ...o,
    stage: "unknown",
    bearStage: "unknown",
    bladeState: "none",
    radar: null,
    bear: null,
    liq: null,
    reasons: [],
    bearReasons: [],
    why: "尚未掃描",
    bearWhy: "尚未掃描"
  };
  Object.assign(o, sc); // 量能與趨勢結構欄位一併帶進來
  /* 基準量來自歷史（變化慢、可快取），現量來自每 90 秒更新的行情端點。
     兩者相除即時算出，所以量能倍數不會停在上次深掃的瞬間。 */
  if (sc.base7 && o.vol) {
    o.rvol7 = o.vol / sc.base7;
    o.rvol30 = sc.base30 ? o.vol / sc.base30 : o.rvol30;
  }
  o.scanTs = sc.ts || null;
  o.d90 = o.h90 ? (o.price / o.h90 - 1) * 100 : null;
  o.lowUp90 = o.l90 ? (o.price / o.l90 - 1) * 100 : null;
  o.pos = o.h90 > o.l90 ? (o.price - o.l90) / (o.h90 - o.l90) : 0.5;

  /* 1. 量能倍數 */
  o.sRvol = clamp(Math.log(Math.max(o.rvol7, 0.2)) / Math.log(6) * 110 + 12, 0, 100);

  /* 2. 成交額市值比：太低沒人玩，太高多半是洗量 */
  const t = o.turn ?? 0;
  let sTurn = clamp((Math.log10(Math.max(t, 0.05)) - Math.log10(0.3)) / (Math.log10(25) - Math.log10(0.3)) * 100, 0, 100);
  if (t > 60) sTurn = Math.max(25, sTurn - (t - 60) * 0.6);
  o.sTurn = sTurn;

  /* 3. 價量確認 */
  let sPc = 50;
  sPc += o.rvol7 >= 1.5 ? 15 : o.rvol7 >= 1.2 ? 8 : o.rvol7 < 0.8 ? -10 : 0;
  sPc += clamp((o.m24 ?? 0) * 3, -25, 25);
  sPc += clamp((o.m7 ?? 0) * 0.6, -15, 15);
  sPc += o.brk20 ? 15 : 0;
  o.sPc = clamp(sPc, 0, 100);
  o.pcTag = o.rvol7 >= 1.4 && (o.m24 ?? 0) > 1.5 ? "價漲量增" : o.rvol7 >= 1.4 && (o.m24 ?? 0) < -1.5 ? "價跌量增" : o.rvol7 < 0.85 && (o.m24 ?? 0) > 1.5 ? "價漲量縮" : o.rvol7 < 0.85 && (o.m24 ?? 0) < -1.5 ? "價跌量縮" : "量價平淡";

  /* 4. 流動性質量 */
  const volScore = clamp((Math.log10(Math.max(o.vol, 1)) - 5) / 3 * 100, 0, 100);
  const stable = clamp(100 - o.volCV * 80, 0, 100);
  const mcapScore = clamp((Math.log10(Math.max(o.mcap, 1)) - 6.5) / 3.5 * 100, 0, 100);
  let liq = 0.45 * volScore + 0.25 * stable + 0.3 * mcapScore;
  if (t > 150) liq -= 35;
  if (t < 0.3) liq -= 25;
  if (o.vol < 3e5) liq -= 25;
  o.liq = clamp(liq, 0, 100);
  o.sLiq = o.liq;

  /* 5. 啟動階段 */
  const m7 = o.m7 ?? 0,
    m30 = o.m30 ?? 0,
    m24 = o.m24 ?? 0;
  o.stage = o.d90 > -3 && (m30 > 60 || o.rvol7 > 4 || t > 60) ? "hot" : o.rvol7 >= 1.4 && m24 < -1.5 ? "dump" : o.rvol7 >= 1.5 && o.pos < 0.55 && m7 > 0 ? "ignite" : o.rvol7 >= 1.3 && o.d90 > -12 && m7 > 5 ? "accel" : m30 < -15 && o.rvol7 < 1 ? "fade" : o.rvol7 < 1.2 && Math.abs(m7) < 5 ? "quiet" : "active";
  o.sStage = STAGES[o.stage].score;

  /* 6. 綜合雷達分數 */
  let raw = 0.34 * o.sRvol + 0.14 * o.sTurn + 0.24 * o.sPc + 0.16 * o.sStage + 0.12 * o.sLiq;
  // 放量而價格不配合，是出貨或虛漲，不該因為量大就排到前面
  if (o.pcTag === "價跌量增") raw *= 0.7;else if (o.pcTag === "價漲量縮") raw *= 0.88;
  if (o.liq < 30) raw *= 0.6;
  if (o.liq < 15) raw *= 0.6;
  o.radar = clamp(raw, 0, 100);

  /* 7. 風險 */
  o.riskChase = clamp((o.d90 > -5 ? 35 : o.d90 > -12 ? 20 : 0) + clamp(m30 * 0.45, 0, 30) + (o.rvol7 > 4 ? 20 : o.rvol7 > 2.5 ? 10 : 0) + clamp(o.vola * 0.12, 0, 20), 0, 100);
  o.riskCrash = clamp(clamp(o.vola * 0.28, 0, 35) + clamp(m30 * 0.3, 0, 25) + (m24 < -3 && o.rvol7 > 1.5 ? 20 : 0) + (t > 80 ? 15 : 0) + (o.volCV > 0.9 ? 10 : 0), 0, 100);
  o.riskLiq = clamp(100 - o.liq, 0, 100);
  o.riskMax = Math.max(o.riskChase, o.riskCrash, o.riskLiq);

  /* 8. 白話解讀 */
  const R = [];
  R.push({
    k: "量能倍數",
    v: fmtX(o.rvol7),
    s: o.sRvol,
    t: o.rvol7 >= 3 ? `成交量衝到平常的 ${o.rvol7.toFixed(1)} 倍，是明顯的異常放量，通常代表有新資金或消息進場。` : o.rvol7 >= 1.8 ? `成交量放大到平常的 ${o.rvol7.toFixed(1)} 倍，有人開始積極買賣。` : o.rvol7 >= 1.2 ? `成交量比平常多一些（${o.rvol7.toFixed(1)} 倍），還算不上異動。` : o.rvol7 >= 0.8 ? "成交量跟平常差不多，沒有特別的資金動作。" : `成交量只有平常的 ${o.rvol7.toFixed(1)} 倍，市場對它興趣缺缺。`
  });
  R.push({
    k: "成交額市值比",
    v: t.toFixed(1) + "%",
    s: o.sTurn,
    t: t > 80 ? `一天成交的金額是整個市值的 ${t.toFixed(0)}%，高得不合常理，要留意是不是刷量。` : t > 25 ? `一天換手 ${t.toFixed(0)}%，資金進出非常熱絡。` : t > 5 ? `一天換手 ${t.toFixed(1)}%，交易活躍度健康。` : `一天只換手 ${t.toFixed(1)}%，籌碼幾乎沒在動。`
  });
  R.push({
    k: "價量確認",
    v: o.pcTag,
    s: o.sPc,
    t: o.pcTag === "價漲量增" ? `價格漲 ${fmtPct(m24)} 且同時放量${o.brk20 ? "，還站上 20 日新高，是有量支撐的突破" : "，漲勢有成交量撐著"}。` : o.pcTag === "價跌量增" ? `量放大但價格跌了 ${fmtPct(m24)}，比較像有人趁人多的時候出貨。` : o.pcTag === "價漲量縮" ? "價格在漲，成交量卻縮小，買盤不厚，這種漲勢容易回吐。" : o.pcTag === "價跌量縮" ? "價跌但量也縮，多半只是沒人接手的自然下滑。" : "價格與成交量都沒有明確方向。"
  });
  R.push({
    k: "流動性質量",
    v: o.liq.toFixed(0),
    s: o.liq,
    t: o.liq >= 70 ? `一天成交 ${fmtUsd(o.vol)}，量能穩定，一般大小的單子進出不會有什麼滑價。` : o.liq >= 45 ? `一天成交 ${fmtUsd(o.vol)}，流動性中等，大單分批下比較安全。` : `一天只成交 ${fmtUsd(o.vol)}${o.volCV > 0.8 ? "，而且量忽大忽小" : ""}，價格容易被少數人推動，滑價和被操縱的風險都高。`
  });
  R.push({
    k: "位置",
    v: o.d90 != null ? o.d90.toFixed(1) + "%" : "—",
    s: clamp(o.pos * 100, 0, 100),
    t: o.d90 > -3 ? "現價幾乎就在 90 天最高點，等於買在這三個月最貴的位置。" : o.d90 > -12 ? `距離 90 天高點還有 ${Math.abs(o.d90).toFixed(1)}%，位在區間上緣。` : o.d90 > -35 ? `距離 90 天高點 ${Math.abs(o.d90).toFixed(0)}%，在區間中段，上面還有空間。` : `距離 90 天高點 ${Math.abs(o.d90).toFixed(0)}%，仍在低檔區。`
  });
  o.reasons = R;
  const risks = [];
  if (o.riskChase >= 60) risks.push(`追高風險 ${o.riskChase.toFixed(0)}：${o.d90 > -5 ? "已經在高點附近" : "近月漲幅偏大"}，現在進場等於接在漲勢末段。`);
  if (o.riskCrash >= 60) risks.push(`暴跌風險 ${o.riskCrash.toFixed(0)}：年化波動約 ${o.vola.toFixed(0)}%，這種波動下單日跌一兩成很正常。`);
  if (o.riskLiq >= 60) risks.push(`流動性風險 ${o.riskLiq.toFixed(0)}：成交太薄，想賣的時候不一定有人接，價格也容易被拉抬。`);
  if (!risks.length) risks.push("三項風險都在中等以下，但加密貨幣本來就沒有低風險標的。");
  o.riskNotes = risks;

  /* 表格用的一句話 */
  const bits = [];
  if (o.rvol7 >= 1.5) bits.push(`量增 ${o.rvol7.toFixed(1)} 倍`);else if (o.rvol7 < 0.8) bits.push("量縮");
  bits.push(o.pcTag);
  if (o.brk20) bits.push("破 20 日高");
  if (o.d90 > -3) bits.push("貼近 90 日高");
  if (o.liq < 35) bits.push("流動性偏薄");
  o.why = bits.slice(0, 3).join(" · ");
  o.bladePlan = bladePlan(o);
  return analyzeBear(o);
}

/* 依三刀流狀態產出具體的進出場計畫 */
function bladePlan(o) {
  if (!o.bladeState || o.bladeState === "none") return null;
  const p = o.price,
    g = o.ma60,
    r = o.ma240,
    b = o.ma20;
  const st = o.bladeState;
  const near = x => Math.abs((p / x - 1) * 100);
  if (st === "attackLong") {
    return {
      side: "多",
      action: "續抱／回踩小綠加碼",
      entry: `回踩小綠 ${fmtPrice(g)} 附近不破就進場${near(g) < 1.5 ? "（現價已貼近小綠，是相對好的位置）" : `（現價高出小綠 ${o.dGreen.toFixed(1)}%，追進去成本偏高）`}`,
      exit: `小藍 ${fmtPrice(b)} 斜率翻負就分批下車`,
      stop: `跌破小橘 ${fmtPrice(r)} 代表方向錯了，全部出場`,
      note: near(g) > 4 ? "離小綠太遠，這個位置追多的風險報酬不划算，等回踩。" : null
    };
  }
  if (st === "takeLong") {
    return {
      side: "多",
      action: "停利，不加碼",
      entry: "不再新增多單",
      exit: `小藍 ${fmtPrice(b)} 已翻負斜率，張飛在收尾，分批獲利了結`,
      stop: `跌破小綠 ${fmtPrice(g)} 剩餘部位出清`,
      note: "小藍轉負只是停利訊號，不是反手做空的訊號。"
    };
  }
  if (st === "correction") {
    return {
      side: "觀望",
      action: "等站回小綠",
      entry: `站回小綠 ${fmtPrice(g)} 之上再進多單`,
      exit: "—",
      stop: `跌破小橘 ${fmtPrice(r)} 才改看空`,
      note: "破綠不破橘叫修正，方向沒變。這裡反手做空是逆勢，勝率低。"
    };
  }
  if (st === "rebound") {
    return {
      side: "觀望",
      action: "不追多，等表態",
      entry: `站上小橘 ${fmtPrice(r)} 且站穩，才考慮轉多`,
      exit: "空單先退場觀望",
      stop: "—",
      note: "上綠不上橘叫反彈，大方向還在空方。這裡追多最容易被套在反彈末端。"
    };
  }
  if (st === "attackShort") {
    return {
      side: "空",
      action: "續抱／反彈到小綠加空",
      entry: `反彈到小綠 ${fmtPrice(g)} 附近不站上就進場${near(g) < 1.5 ? "（現價已貼近小綠，位置理想）" : `（現價低於小綠 ${Math.abs(o.dGreen).toFixed(1)}%，追空成本偏高）`}`,
      exit: `小藍 ${fmtPrice(b)} 斜率翻正就分批回補`,
      stop: `站上小橘 ${fmtPrice(r)} 代表方向錯了，全部出場`,
      note: near(g) > 4 ? "離小綠太遠，這個位置追空容易被反彈軋到，等反彈。" : null
    };
  }
  return {
    side: "空",
    action: "回補，不加空",
    entry: "不再新增空單",
    exit: `小藍 ${fmtPrice(b)} 已翻正斜率，反彈將至，空單回補`,
    stop: `站上小綠 ${fmtPrice(g)} 剩餘空單出清`,
    note: "小藍轉正只是回補訊號，不代表可以直接翻多。"
  };
}

/* ════ 空頭雷達評分 ══════════════════════════════════════ */
function analyzeBear(o) {
  if (o.ema20 == null || !isFinite(o.ema20)) {
    return Object.assign(o, {
      bearStage: "unknown",
      bear: null,
      bearWhy: "未掃描"
    });
  }
  const price = o.price;
  o.distEma = (price / o.ema20 - 1) * 100;
  const below = price < o.ema20;
  const trendDown = o.ema20 < o.ema50;
  const struct = (below ? 1 : 0) + (trendDown ? 1 : 0) + (o.lowerHigh ? 1 : 0) + (o.lowerLow ? 1 : 0);
  o.structScore = struct / 4 * 100;

  /* 追空風險：連續大跌、乖離過大、RSI 超賣時最高 */
  o.chaseShort = clamp((o.rsi < 25 ? 35 : o.rsi < 32 ? 22 : 0) + clamp((-o.drop - 25) * 1.2, 0, 30) + (o.distEma < -18 ? 25 : o.distEma < -10 ? 12 : 0) + (o.downDays >= 4 ? 15 : 0), 0, 100);

  /* 階段判定 */
  const s1 = below && trendDown && (o.lowerLow || o.lowerHigh) && o.drop <= -8 && o.retrace < 0.3 && o.volExpand >= 1.1;
  const s2 = trendDown && o.drop <= -12 && o.retrace >= 0.3 && o.retrace <= 0.78 && (o.volRatio == null || o.volRatio < 0.95) && o.distEma < 6;
  o.bearStage = s1 ? "drop" : s2 ? "rebound" : "none";

  /* 分項評分 */
  const sTrend = o.structScore;
  const sVol = o.bearStage === "drop" ? clamp((o.volExpand - 0.9) / 1.6 * 100, 0, 100) : o.volRatio == null ? 50 : clamp((1 - o.volRatio) / 0.6 * 100, 0, 100);
  const sLoc = o.bearStage === "drop" ? clamp((o.brokeSupport ? 85 : 60) - clamp((-o.drop - 20) * 1.5, 0, 40), 0, 100) : clamp(100 - Math.abs(o.retrace - 0.575) / 0.25 * 100, 0, 100);
  o.sBearTrend = sTrend;
  o.sBearVol = sVol;
  o.sBearLoc = sLoc;
  let b = 0.25 * sTrend + 0.25 * sVol + 0.25 * sLoc + 0.15 * (o.liq ?? 50) + 0.10 * (100 - o.chaseShort);
  if (o.bearStage === "none") b *= 0.45;
  if ((o.liq ?? 0) < 30) b *= 0.6;
  o.bear = clamp(b, 0, 100);

  /* 入場區、止損、目標 */
  const atr = o.atr || price * 0.03;
  if (o.bearStage === "rebound") {
    o.entryLo = Math.min(o.fib50, o.fib618);
    o.entryHi = Math.max(o.fib50, o.fib618);
    o.emaInZone = o.ema20 >= o.entryLo * 0.97 && o.ema20 <= o.entryHi * 1.03;
    o.stop = Math.max(o.fib786, o.bounceHigh) + 0.5 * atr;
  } else if (o.bearStage === "drop") {
    const above = [o.ema20, o.brokeSupport ? o.support : null].filter(v => v && v > price);
    o.entryLo = above.length ? Math.min(...above) : price * 1.01;
    o.entryHi = above.length ? Math.max(...above) : price * 1.04;
    if (o.entryHi / o.entryLo < 1.01) {
      o.entryLo *= 0.995;
      o.entryHi *= 1.015;
    }
    o.emaInZone = true;
    o.stop = Math.max(o.entryHi * 1.01, o.bounceHigh) + 0.5 * atr;
  } else {
    o.entryLo = null;
    o.entryHi = null;
    o.stop = null;
  }
  if (o.entryLo) {
    const mid = (o.entryLo + o.entryHi) / 2;
    o.entryMid = mid;
    o.target = Math.min(o.swingLow, price * 0.97);
    o.stopPct = (o.stop / mid - 1) * 100;
    o.rr = o.stop > mid ? (mid - o.target) / (o.stop - mid) : null;
  }

  /* 白話解讀 */
  const R = [];
  R.push({
    k: "趨勢結構",
    v: `${struct}/4`,
    s: sTrend,
    t: struct >= 3 ? `價格${below ? "在 EMA20 之下" : "尚未跌破 EMA20"}，${o.lowerHigh ? "高點一個比一個低" : ""}${o.lowerLow ? "、低點也持續破底" : ""}，是明確的空頭排列。` : `四個空頭條件只符合 ${struct} 項，趨勢還沒完全轉弱，現在做空等於猜頭。`
  });
  R.push({
    k: "與 EMA20 距離",
    v: fmtPct(o.distEma),
    s: clamp(50 - o.distEma * 2, 0, 100),
    t: o.distEma < -15 ? `已經跌到均線下方 ${Math.abs(o.distEma).toFixed(0)}%，乖離很大，隨時可能有反彈，這裡追空最容易被軋。` : o.distEma < -3 ? `在 EMA20 下方 ${Math.abs(o.distEma).toFixed(1)}%，均線正壓在頭上。` : o.distEma <= 3 ? "剛好貼著 EMA20，這條均線通常是反彈的第一道壓力。" : `還在 EMA20 上方 ${o.distEma.toFixed(1)}%，均線尚未轉為壓力。`
  });
  R.push({
    k: "下跌幅度",
    v: fmtPct(o.drop),
    s: clamp(-o.drop * 2, 0, 100),
    t: `從近期高點 ${fmtPrice(o.swingHigh)} 跌到 ${fmtPrice(o.swingLow)}，跌了 ${Math.abs(o.drop).toFixed(1)}%。${-o.drop > 35 ? "跌幅已經很大，後面的下跌空間相對有限。" : ""}`
  });
  R.push({
    k: "反彈幅度",
    v: o.bounce > 0.5 ? `${o.bounce.toFixed(1)}%（回撤 ${(o.retrace * 100).toFixed(0)}%）` : "尚未反彈",
    s: sLoc,
    t: o.retrace >= 0.45 && o.retrace <= 0.7 ? `反彈到下跌段的 ${(o.retrace * 100).toFixed(0)}%，正好落在 0.5–0.618 這個常見的壓力帶。` : o.retrace < 0.3 ? "還在低檔附近，反彈幅度不足，屬於下跌途中而不是等待做空的位置。" : `反彈已經走到 ${(o.retrace * 100).toFixed(0)}%，超過 0.618 之後空頭結構的可信度就下降了。`
  });
  R.push({
    k: "量能對比",
    v: o.volRatio == null ? "—" : `${o.volRatio.toFixed(2)}x`,
    s: sVol,
    t: o.bearStage === "drop" ? `最近三天的成交量是過去一個月平均的 ${o.volExpand.toFixed(2)} 倍，${o.volExpand >= 1.3 ? "下跌是帶量的，賣壓真實" : "量能沒有明顯放大，跌勢力道一般"}。` : o.volRatio == null ? "反彈時間太短，還算不出量能對比。" : o.volRatio < 0.7 ? `反彈的成交量只有下跌時的 ${(o.volRatio * 100).toFixed(0)}%，買盤明顯不足，這種反彈通常撐不久。` : o.volRatio < 1 ? `反彈量是下跌量的 ${(o.volRatio * 100).toFixed(0)}%，比下跌時小一些。` : `反彈量反而比下跌時還大，可能有真的買盤進場，空頭要留意。`
  });
  if (o.bodyFade != null) {
    R.push({
      k: "陽線力道",
      v: o.bodyFade.toFixed(2) + "x",
      s: clamp((1.2 - o.bodyFade) * 90, 0, 100),
      t: o.bodyFade < 0.8 ? "反彈後段的陽線實體明顯變小，往上推的力道正在衰竭。" : o.bodyFade > 1.2 ? "反彈後段的陽線反而變長，買方還有力氣，先別急著空。" : "反彈的陽線力道大致持平，還看不出衰竭。"
    });
  }
  R.push({
    k: "流動性",
    v: (o.liq ?? 0).toFixed(0),

  });
  o.bearReasons = R;
  const w = [];
  if (o.chaseShort >= 65) w.push(`追空風險 ${o.chaseShort.toFixed(0)}：已經連續下跌${o.downDays >= 3 ? ` ${o.downDays} 天` : ""}、乖離 ${o.distEma.toFixed(0)}%，RSI ${o.rsi.toFixed(0)}。在這個位置追空，等於在別人準備停損反彈時進場。`);else if (o.chaseShort >= 40) w.push(`追空風險 ${o.chaseShort.toFixed(0)}：跌勢已經走了一段，進場點要更嚴格，別看到黑K就追。`);
  if (o.bearStage === "drop") w.push("加速下跌段的特徵是波動放大，回抽往往又快又猛，止損位置要留足夠空間。");
  if (o.bearStage === "rebound" && o.retrace > 0.65) w.push("回撤已接近 0.618 上緣，再往上就要考慮這根本不是反彈，而是趨勢反轉。");
  if ((o.liq ?? 0) < 40) w.push("流動性不足的幣容易被人為拉抬觸發強平，部位要比平常再小一些。");
  if (!w.length) w.push("目前沒有特別突出的風險項，但空頭部位的虧損理論上沒有上限，務必設止損。");
  o.bearWarn = w;
  const bits = [];
  bits.push(BEAR_STAGES[o.bearStage].label);
  if (o.brokeSupport) bits.push("跌破支撐");
  if (o.volRatio != null && o.volRatio < 0.7) bits.push("反彈量縮");
  if (o.retrace >= 0.45 && o.retrace <= 0.7) bits.push("在 0.5–0.618 帶");
  if (o.chaseShort >= 65) bits.push("追空風險高");
  o.bearWhy = bits.slice(0, 3).join(" · ");
  return o;
}

/* ════ 本機儲存（僅在下載後的本機頁面可持久化） ═════════ */
const store = {
  ok: (() => {
    try {
      localStorage.setItem("cgs:t", "1");
      localStorage.removeItem("cgs:t");
      return true;
    } catch (e) {
      return false;
    }
  })(),
  get(k, d) {
    try {
      const v = localStorage.getItem("cgs:" + k);
      return v == null ? d : JSON.parse(v);
    } catch (e) {
      return d;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem("cgs:" + k, JSON.stringify(v));
      return "ok";
    } catch (e) {
      return "fail";
    }
  },
  /* 掃描快取可能很大。寫不進去時先丟掉最舊的三成再試一次，
     總比整包存不進去、重整後全沒了要好。 */
  setScans(v) {
    if (!this.ok) return "nostore";
    if (this.set("scans", v) === "ok") return "ok";
    const ent = Object.entries(v).filter(([, x]) => x && x.ts).sort((a, b) => b[1].ts - a[1].ts);
    const keep = Object.fromEntries(ent.slice(0, Math.max(30, Math.floor(ent.length * 0.7))));
    return this.set("scans", keep) === "ok" ? "trimmed" : "quota";
  }
};

/* ════ 提醒條件檢查 ══════════════════════════════════════ */
function bullGate(r, c) {
  const checks = [["量能放大", r.rvol7 >= c.minRvol, `量能 ${fmtX(r.rvol7)}，門檻 ${c.minRvol}x`], ["價格走強", (r.m24 ?? 0) > 0 && (r.pcTag === "價漲量增" || r.brk20), `${r.pcTag}${r.brk20 ? " · 站上 20 日新高" : ""}`], ["流動性合格", (r.liq ?? 0) >= c.minLiq, `流動性 ${(r.liq ?? 0).toFixed(0)}，門檻 ${c.minLiq}`], ["追高風險可控", (r.riskChase ?? 100) <= c.maxChase, `追高風險 ${(r.riskChase ?? 0).toFixed(0)}，上限 ${c.maxChase}`], ["雷達分數達標", (r.radar ?? 0) >= c.minRadar, `雷達分數 ${(r.radar ?? 0).toFixed(0)}，門檻 ${c.minRadar}`]];
  if (c.requireBlade) checks.push(["三刀流站上綠橘", r.bladeState === "attackLong" || r.bladeState === "takeLong", `三刀流 ${(BLADE[r.bladeState] || BLADE.none).label}`]);
  return {
    pass: checks.every(x => x[1]),
    checks,
    score: r.radar ?? 0
  };
}
function bearGate(r, c) {
  const rebFail = r.bearStage === "rebound" ? r.volRatio != null && r.volRatio < c.maxVolRatio : r.bearStage === "drop" && r.volExpand >= 1.1;
  const checks = [["趨勢向下", (r.structScore ?? 0) >= c.minStruct, `空頭結構 ${(r.structScore ?? 0).toFixed(0)}/100`], ["反彈失敗或賣壓延續", rebFail, r.bearStage === "rebound" ? `反彈量僅下跌量的 ${(r.volRatio != null ? r.volRatio * 100 : 0).toFixed(0)}%` : `下跌量能 ${(r.volExpand ?? 0).toFixed(2)} 倍`], ["流動性合格", (r.liq ?? 0) >= c.minLiq, `流動性 ${(r.liq ?? 0).toFixed(0)}，門檻 ${c.minLiq}`], ["止損位置清晰", r.stop != null && r.stopPct != null && r.stopPct <= c.maxStopPct, r.stopPct != null ? `止損距入場 ${r.stopPct.toFixed(1)}%，上限 ${c.maxStopPct}%` : "無有效止損位"], ["空頭評分達標", (r.bear ?? 0) >= c.minBear, `空頭評分 ${(r.bear ?? 0).toFixed(0)}，門檻 ${c.minBear}`]];
  if (c.requireBlade) checks.push(["三刀流跌破綠橘", r.bladeState === "attackShort" || r.bladeState === "coverShort", `三刀流 ${(BLADE[r.bladeState] || BLADE.none).label}`]);
  return {
    pass: checks.every(x => x[1]),
    checks,
    score: r.bear ?? 0
  };
}

/* ════ 訊號狀態機 ════════════════════════════════════════
   同一個訊號只通知一次；只有這四種「狀態明顯改變」才重新通知：
   first 首次成立 / upgrade 評分再提高 / breakout 價格完成突破 / restart 回調後再啟動
   ════════════════════════════════════════════════════════ */
const EVENT = {
  first: {
    label: "首次觸發",
    color: C.teal
  },
  upgrade: {
    label: "評分提高",
    color: C.gold
  },
  breakout: {
    label: "完成突破",
    color: C.green
  },
  restart: {
    label: "回調後再啟動",
    color: C.violet
  }
};
function evaluateSignals(rows, cfg, states, now) {
  const events = [];
  const next = {
    ...states
  };
  rows.forEach(r => {
    if (!r.scanned) return;
    ["bull", "bear"].forEach(side => {
      const g = side === "bull" ? bullGate(r, cfg.bull) : bearGate(r, cfg.bear);
      const key = r.id + ":" + side;
      const st = next[key];
      const price = r.price;
      if (!g.pass) {
        if (st) next[key] = {
          ...st,
          cooled: true
        }; // 條件失效，標記為冷卻，之後再成立算「再啟動」
        return;
      }
      const cool = st && now - st.lastTs < cfg.cooldownMin * 60000;
      let type = null;
      if (!st) type = "first";else if (st.cooled) type = "restart";else if (g.score >= st.peakScore + cfg.minDelta) type = "upgrade";else if (side === "bull" && price > st.refPrice * (1 + cfg.breakoutPct / 100) && r.brk20) type = "breakout";else if (side === "bear" && price < st.refPrice * (1 - cfg.breakoutPct / 100) && r.brokeSupport) type = "breakout";
      if (!type || cool && type !== "restart") {
        if (st) next[key] = {
          ...st,
          peakScore: Math.max(st.peakScore, g.score)
        };
        return;
      }
      next[key] = {
        firstTs: st ? st.firstTs : now,
        firstPrice: st ? st.firstPrice : price,
        firstScore: st ? st.firstScore : g.score,
        lastTs: now,
        refPrice: price,
        peakScore: Math.max(st ? st.peakScore : 0, g.score),
        cooled: false
      };
      events.push({
        id: r.id,
        sym: r.sym,
        name: r.name,
        side,
        type,
        ts: now,
        price,
        score: g.score,
        stage: side === "bull" ? STAGES[r.stage].label : BEAR_STAGES[r.bearStage].label,
        checks: g.checks.map(c => c[2]),
        // 空頭的進場區／止損只屬於空頭訊號；多頭改帶三刀流的多方計畫
        entryLo: side === "bear" ? r.entryLo ?? null : null,
        entryHi: side === "bear" ? r.entryHi ?? null : null,
        stop: side === "bear" ? r.stop ?? null : null,
        plan: r.bladePlan && (side === "bull" && r.bladePlan.side === "多" || side === "bear" && r.bladePlan.side === "空") ? r.bladePlan : null,
        blade: r.bladeState ? {
          state: r.bladeState,
          ma20: r.ma20,
          ma60: r.ma60,
          ma240: r.ma240,
          dGreen: r.dGreen,
          slope20: r.slope20
        } : null,
        firstTs: next[key].firstTs,
        firstPrice: next[key].firstPrice,
        firstScore: next[key].firstScore,
        maxUp: 0,
        maxDown: 0,
        verdict: "open",
        hitTs: null

    });
  });
  return {
    events,
    next

}
function alertText(e) {
  const bull = e.side === "bull";
  const title = `${e.sym} ${bull ? "多頭" : "空頭"} · ${EVENT[e.type].label}`;
  const L = [`${bull ? "▲ 做多方向" : "▼ 做空方向"}　${e.sym}　${fmtPrice(e.price)}`, e.name, "", `評分 ${e.score.toFixed(0)}　階段 ${e.stage}`];
  if (e.blade) {
    L.push(`三刀流 ${(BLADE[e.blade.state] || BLADE.none).label}` + `（距小綠 ${e.blade.dGreen >= 0 ? "+" : ""}${e.blade.dGreen.toFixed(1)}%，小藍斜率${e.blade.slope20 >= 0 ? "正" : "負"}）`);
  }
  L.push("", "── 進出場參考 ──");
  if (e.plan) L.push(`進場　${e.plan.entry}`, `出場　${e.plan.exit}`, `停損　${e.plan.stop}`);else if (e.entryLo) L.push(`進場　${fmtPrice(e.entryLo)}–${fmtPrice(e.entryHi)}`, `停損　${fmtPrice(e.stop)}`);else L.push("三刀流未給明確位置，先觀望");
  if (e.blade) L.push(`均線　小綠 ${fmtPrice(e.blade.ma60)}　小橘 ${fmtPrice(e.blade.ma240)}　小藍 ${fmtPrice(e.blade.ma20)}`);
  L.push("", "── 觸發條件 ──", ...e.checks.map(c => "· " + c));
  if (e.type !== "first") L.push("", `首次觸發 ${fmtPrice(e.firstPrice)} / ${e.firstScore.toFixed(0)} 分`);
  L.push("", "僅供技術分析參考，不構成投資建議。");
  return {

    text: L.join("\n")

}

/* ════ 通知發送 ══════════════════════════════════════════ */
async function sendNotify(ch, msg) {
  const out = [];
  if (ch.browser) {
    try {
      if (typeof Notification !== "undefined" && Notification.permission === "granted") {
        new Notification(msg.title, {
          body: msg.text.slice(0, 300)
        });
        out.push(["瀏覽器通知", true, ""]);
      } else out.push(["瀏覽器通知", false, "尚未授權"]);
    } catch (e) {
      out.push(["瀏覽器通知", false, e.message]);
    }
  }
  if (ch.useServer) {
    try {
      const r = await fetch("/api/notify", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          title: msg.title,
          text: msg.text
        })
      });
      const j = await r.json().catch(() => ({}));
      out.push(["伺服器轉發", r.ok, r.ok ? (j.sent || []).join("、") : "HTTP " + r.status]);
    } catch (e) {
      out.push(["伺服器轉發", false, "連不到 screener_server.py"]);
    }
    return out;
  }
  if (ch.tgToken && ch.tgChat) {
    try {
      // 用 GET 帶查詢參數，屬於 simple request，不會觸發 CORS 預檢
      const u = `https://api.telegram.org/bot${encodeURIComponent(ch.tgToken)}/sendMessage` + `?chat_id=${encodeURIComponent(ch.tgChat)}&text=${encodeURIComponent(msg.title + "\n" + msg.text)}`;
      const r = await fetch(u);
      out.push(["Telegram", r.ok, r.ok ? "" : "HTTP " + r.status]);
    } catch (e) {
      out.push(["Telegram", false, "被瀏覽器攔截"]);
    }
  }
  if (ch.discord) {
    try {
      const r = await fetch(ch.discord, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          content: `**${msg.title}**\n${msg.text}`
        })
      });
      out.push(["Discord", r.ok || r.status === 204, r.ok ? "" : "HTTP " + r.status]);
    } catch (e) {
      out.push(["Discord", false, "跨域被擋，改用伺服器轉發"]);
    }
  }
  if (ch.email && !ch.useServer) out.push(["電子郵件", false, "瀏覽器無法直接寄信，需開啟伺服器轉發"]);
  return out;
}

/* ════════════════════════════════════════════════════════
   鏈上異動雷達
   熱度資料：GeckoTerminal（新池、熱門池、成交、買賣人數、流動性）
   安全資料：GoPlus Token Security（蜜罐、稅率、權限、LP 鎖倉、持幣集中度）
   兩者都是免費公開 API，且支援跨域。
   ════════════════════════════════════════════════════════ */
const GT_BASE = "https://api.geckoterminal.com/api/v2";
const GP_BASE = "https://api.gopluslabs.io/api/v1";
const NETWORKS = [{
  id: "eth",

  gp: "1"
}, {
  id: "bsc",
  name: "BNB Chain",
  gp: "56"
}, {
  id: "base",

}, {
  id: "arbitrum",

}, {
  id: "polygon_pos",
  name: "Polygon",
  gp: "137"
}, {
  id: "solana",
  name: "Solana",
  gp: "solana"
}];
const chainGate = {
  last: 0,
  chain: Promise.resolve()
};
function enqueueOn(g, fn, minGap) {
  const run = g.chain.then(async () => {
    const wait = Math.max(0, g.last + minGap - Date.now());
    if (wait) await sleep(wait);
    g.last = Date.now();
    return fn();
  });
  g.chain = run.catch(() => {});
  return run;
}
async function chainFetch(kind, path, cfg) {
  const url = cfg.local ? (kind === "gt" ? "/api/gt" : "/api/gp") + path : (kind === "gt" ? GT_BASE : GP_BASE) + path;
  return enqueueOn(chainGate, async () => {
    for (let a = 0; a < 3; a++) {
      let res;
      try {
        res = await fetch(url, {
          method: "GET",
          mode: "cors",
          cache: "no-store"
        });
      } catch (e) {
        throw new Error("BLOCKED");
      }
      if (res.status === 429) {
        if (a < 2) {
          await sleep(5000 * (a + 1));
          continue;
        }
        throw new Error("RATE");
      }
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }
  }, 2200);
}

const pctNum = v => v == null || v === "" ? null : parseFloat(v) * 100;

function securityScore(g, isSol) {

    if (isOn(g.cannot_sell_all)) cut(60, "block", "無法全部賣出", "合約限制你不能一次賣光，出場會被卡住。");
    if (isOn(g.cannot_buy)) cut(30, "high", "無法買入", "目前買不進去，可能是尚未開盤或被限制。");
    if (isOn(g.transfer_pausable)) cut(30, "block", "可暫停交易", "合約方能隨時凍結所有轉帳，你會在最想賣的時候賣不掉。");
    if (isOn(g.is_blacklisted)) cut(25, "high", "可列黑名單", "合約方能把特定地址列入黑名單，讓該地址無法交易。");

    if (isOn(g.owner_change_balance)) cut(35, "block", "擁有者可改餘額", "合約方能直接修改任何人的持幣數量。");
    if (isOn(g.slippage_modifiable) || isOn(g.personal_slippage_modifiable)) cut(20, "high", "稅率可調", "交易稅可以隨時被改高，現在低不代表賣的時候還低。");

    if (isOn(g.trading_cooldown)) cut(10, "mid", "交易冷卻", "兩次交易之間有強制間隔，急著出場時會卡住。");

  const [proxyMode, setProxyMode] = useState(() => store.get("proxyMode", "detecting"));
  const [proxyForce, setProxyForce] = useState(() => store.get("proxyForce", false));
  const [autoRefresh, setAutoRefresh] = useState(false);
  const [showConn, setShowConn] = useState(false);

  const [dirs, setDirs] = useState({

  const [activePreset, setActivePreset] = useState("量能優先");

  const [minMcap, setMinMcap] = useState(1e7);

  const rawRef = useRef([]);

  useEffect(() => {

  useEffect(() => {
    store.set("adminKey", tgAdmin);

  useEffect(() => {

  const saveTimer = useRef(null);

  useEffect(() => {

  const flushScans = useCallback(() => {

  }, []);
  useEffect(() => {
    // 節流寫入，避免每掃一檔就序列化整包
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(flushScans, 1200);
    return () => clearTimeout(saveTimer.current);
  }, [scans, flushScans]);

  /* 關閉分頁、切到背景、重新整理之前先立刻存檔，
     不然掃到一半離開就會少掉最後那幾檔 */
  useEffect(() => {
    const h = () => {
      if (document.visibilityState === "hidden") flushScans();
    };
    document.addEventListener("visibilitychange", h);
    window.addEventListener("pagehide", flushScans);
    return () => {
      document.removeEventListener("visibilitychange", h);
      window.removeEventListener("pagehide", flushScans);
      flushScans();
    };
  }, [flushScans]);
  useEffect(() => {
    store.set("alertCfg", alertCfg);
  }, [alertCfg]);
  useEffect(() => {
    store.set("history", history.slice(0, 400));
  }, [history]);
  useEffect(() => {
    store.set("sigStates", sigStates);
  }, [sigStates]);
  const toggleWatch = useCallback(id => {
    setWatch(w => w.includes(id) ? w.filter(x => x !== id) : [...w, id]);
  }, []);
  const local = proxyMode === "server";
  const loadRef = useRef(null); // 供 loadMarkets 內部自我重試使用
  const detectRef = useRef(null); // 同上：detectProxy 定義在後面，透過 ref 取用
  const cfg = useMemo(() => ({
    key: apiKey.trim(),
    pro,
    proxy: proxy.trim(),
    local
  }), [apiKey, pro, proxy, local]);
  const UP = twColor ? C.red : C.green;
  const DOWN = twColor ? C.green : C.red;
  const tone = v => v == null ? C.muted : v > 0 ? UP : v < 0 ? DOWN : C.bone;

  /* 示範資料的掃描結果單獨存放。它用的是真實幣種 id，
     若寫進 scans 會把使用者實際掃出來的快取整包蓋掉。 */
  const loadDemo = useCallback(() => {
    const {
      coins,
      scans: s
    } = makeDemo();
    setRaw(coins);
    setDemoScans(s);
    setSource("demo");
    setUpdated(new Date());
  }, []);
  const loadMarkets = useCallback(async (p = pages) => {
    setLoading(true);
    setError(null);
    try {
      const all = [];
      for (let i = 1; i <= p; i++) {
        const d = await cgFetch(`/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=${i}` + `&sparkline=true&price_change_percentage=1h,24h,7d,30d,1y`, cfg);
        if (!Array.isArray(d)) throw new Error("BADDATA");
        all.push(...d);
      }
      setRaw(all);
      setSource("live");
      setUpdated(new Date());
    } catch (e) {
      // 直連被網路環境擋掉時，先試試同源代理再放棄
      if (e.message === "BLOCKED" && !cfg.local && !store.get("proxyTried", false)) {
        store.set("proxyTried", true);
        const m = detectRef.current ? await detectRef.current({
          ignoreForce: true
        }) : "direct";
        if (m === "server") {
          setError("直連被這個網路擋下，已自動改走伺服器代理，正在重新載入…");
          setTimeout(() => loadRef.current(p), 300);
          setLoading(false);
          return;
        }
      }
      setError(errText(e));
      if (!rawRef.current.length) loadDemo();
    } finally {
      setLoading(false);
    }
  }, [pages, cfg, loadDemo]);
  loadRef.current = loadMarkets;
  const detectProxy = useCallback(async opts => {
    if (store.get("proxyForce", false) && !(opts && opts.ignoreForce)) {
      setProxyMode("server"); // 使用者手動指定，不再自動判定
      return "server";
    }
    let mode = "direct";
    try {
      if (location.protocol.startsWith("http")) {
        // 健康檢查不依賴上游，伺服器就算連不到 CoinGecko 也會回 200
        const r = await fetch("/api/health", {
          cache: "no-store"
        });
        if (r.ok && r.headers.get("X-Screener-Server")) mode = "server";else {
          const r2 = await fetch("/api/v3/ping", {
            cache: "no-store"
          });
          if (r2.ok && r2.headers.get("X-Cache")) mode = "server";
        }
      }
    } catch (e) {/* 兩個都失敗才視為沒有代理 */}
    setProxyMode(mode);
    store.set("proxyMode", mode);
    return mode;
  }, []);
  detectRef.current = detectProxy;
  useEffect(() => {
    let dead = false;
    (async () => {
      await detectProxy();
      if (!dead) loadRef.current(1);
    })();
    return () => {
      dead = true;
    };
    /* eslint-disable-next-line */
  }, []);
  useEffect(() => {
    if (!loading) {
      setLoadSec(0);
      return;
    }
    const t0 = Date.now();
    const t = setInterval(() => setLoadSec(Math.floor((Date.now() - t0) / 1000)), 1000);
    return () => clearInterval(t);
  }, [loading]);
  useEffect(() => {
    if (!autoRefresh) return;
    const t = setInterval(() => {
      if (!loading && !batch.running) loadMarkets();
    }, 90000);
    return () => clearInterval(t);
  }, [autoRefresh, loading, batch.running, loadMarkets]);
  const [diagBusy, setDiagBusy] = useState(false);
  const diagAbort = useRef(false);
  const runDiag = useCallback(async () => {
    diagAbort.current = false;
    setDiagBusy(true);
    setShowConn(true);
    const out = [];
    const push = (t, ok) => {
      out.push({
        t,
        ok
      });
      setDiag([...out]);
    };
    const step = t => setDiag([...out, {
      t,
      ok: "busy"
    }]);

    /* 每個步驟都有超時，避免節流佇列或重試把畫面卡住 */
    const withTimeout = (p, ms, label) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("TIMEOUT:" + label)), ms))]);
    push(cfg.local ? "連線路徑：同源代理 /api/v3" : "連線路徑：瀏覽器直連 api.coingecko.com", null);

    /* 1. 網頁伺服器本身 */
    if (cfg.local) {
      step("檢查伺服器是否在線…");
      try {
        const t0 = Date.now();
        const r = await withTimeout(fetch("/api/health?probe=1", {
          cache: "no-store"
        }), 20000, "health");
        const j = await r.json();
        push(`伺服器在線（${Date.now() - t0}ms）　金鑰${j.hasKey ? `已設定（${j.keyLen} 字元${j.pro ? " · Pro" : ""}）` : "未設定"}　` + `記憶體快取 ${j.cached} 筆　磁碟快取 ${j.disk ?? "?"} 筆　已運行 ${Math.floor((j.uptime || 0) / 60)} 分`, true);

        /* 伺服器自己連往上游的結果：這一步能直接分辨是誰連不上 */
        (j.probe || []).forEach(p => {
          if (p.ok) push(`伺服器 → ${p.name}：通過（HTTP ${p.code}，${p.ms}ms）`, true);else {
            const hint = p.code === 403 && /allowlist|egress/i.test(p.detail || "") ? "Zeabur 的網路出口限制擋掉了這個網域，需要在服務設定裡放行。" : /10006|calls limit/i.test(p.detail || "") ? "每月 10,000 次總額度已用盡，等一分鐘沒有用，要等下個月重置或升級方案。" : p.code === 429 ? "每分鐘速率上限，等一分鐘後會自行恢復。" : p.code === 401 || p.code === 403 ? "金鑰被拒絕，確認 CG_API_KEY 是否正確、有沒有多餘空白。" : p.code === 0 ? "連線層失敗（DNS 或逾時），伺服器出不了網。" : `HTTP ${p.code}`;
            push(`伺服器 → ${p.name}：失敗（${p.ms}ms）　${hint}`, false);
            if (p.detail) push(`　　上游回應：${String(p.detail).slice(0, 160)}`, null);
          }
        });
        if ((j.probe || []).some(p => p.name === "CoinGecko" && !p.ok)) {
          push("結論：問題在伺服器連往 CoinGecko 這一段，不是你的手機網路。後續步驟略過。", null);
          setDiagBusy(false);
          return;
        }
      } catch (e) {
        push(String(e.message).startsWith("TIMEOUT") ? "伺服器沒有回應（8 秒逾時）。Zeabur 可能正在重新部署或休眠，稍後再試。" : "連不到伺服器。你的網路可能連這個網址也擋掉了，或服務已停止。", false);
        setDiagBusy(false);
        return;
      }
    }
    if (diagAbort.current) {
      setDiagBusy(false);
      return;
    }

    /* 2. 伺服器（或瀏覽器）能不能連到 CoinGecko */
    step(cfg.local ? "測試伺服器連往 CoinGecko…（額度滿時會等待重試，最多 40 秒）" : "測試瀏覽器連往 CoinGecko…（最多 40 秒）");
    try {
      const t0 = Date.now();
      await withTimeout(cgFetch("/ping", cfg), 40000, "ping");
      push(`CoinGecko 可連線（${Date.now() - t0}ms）`, true);
    } catch (e) {
      const to = String(e.message).startsWith("TIMEOUT");
      push(to ? cfg.local ? "40 秒內沒有回應。多半是免費額度用盡後在排隊重試，填入 API Key 可大幅改善。" : "40 秒內沒有回應，可能被網路攔截或額度用盡。" : "CoinGecko 連線失敗 — " + errText(e), false);
      setDiagBusy(false);
      return;
    }
    if (diagAbort.current) {
      setDiagBusy(false);
      return;
    }

    /* 3. 行情端點 */
    step("測試行情端點…");
    try {
      const t0 = Date.now();
      const d = await withTimeout(cgFetch("/coins/markets?vs_currency=usd&per_page=1&page=1", cfg), 40000, "markets");
      push(`行情端點正常（取回 ${d.length} 筆，${Date.now() - t0}ms）`, true);
    } catch (e) {
      push(String(e.message).startsWith("TIMEOUT") ? "行情端點 40 秒內沒有回應，多半是額度排隊。" : "行情端點失敗 — " + errText(e), false);
    }
    push(cfg.key ? cfg.pro ? "金鑰：Pro" : "金鑰：Demo，每分鐘 30 次" : cfg.local ? "金鑰：瀏覽器未填。若已在 Zeabur 設定 CG_API_KEY，走代理時仍會生效。" : "金鑰：未填，每分鐘僅 5–15 次", cfg.key ? true : null);
    setDiagBusy(false);
  }, [cfg]);

  /* ── 雷達掃描 ── */
  const scan = useCallback(async list => {
    if (source === "demo") return;
    cancelRef.current = false;
    setBatch({
      running: true,
      done: 0,
      total: list.length,
      now: ""
    });
    for (let i = 0; i < list.length; i++) {
      if (cancelRef.current) break;
      const c = list[i];
      setBatch(b => ({
        ...b,
        now: c.sym
      }));
      try {
        const chart = await cgFetch(`/coins/${c.id}/market_chart?vs_currency=usd&days=90`, cfg);
        setScans(prev => ({
          ...prev,
          [c.id]: extractScan(chart, c.vol)
        }));
      } catch (e) {
        if (e.message === "RATE" || e.message === "BLOCKED" || e.message === "NOPROXY") {
          setError(errText(e));
          break;
        }
        setScans(prev => ({
          ...prev,
          [c.id]: {
            err: true
          }
        }));
      }
      setBatch(b => ({
        ...b,
        done: i + 1
      }));
    }
    setBatch({
      running: false,
      done: 0,
      total: 0,
      now: ""
    });
  }, [cfg, source]);

  /* ── 衍生資料 ── */
  const btc30 = useMemo(() => raw.find(c => c.id === "bitcoin")?.price_change_percentage_30d_in_currency ?? 0, [raw]);
  const base = useMemo(() => raw.map(c => {
    const m30 = c.price_change_percentage_30d_in_currency ?? null;
    return {
      id: c.id,
      sym: (c.symbol || "").toUpperCase(),
      name: c.name,
      img: c.image,
      rank: c.market_cap_rank,
      price: c.current_price,
      m1: c.price_change_percentage_1h_in_currency ?? null,
      m24: c.price_change_percentage_24h_in_currency ?? null,
      m7: c.price_change_percentage_7d_in_currency ?? null,
      m30,
      m365: c.price_change_percentage_1y_in_currency ?? null,
      rs: m30 == null ? null : m30 - btc30,

      mcap: c.market_cap ?? 0,

  /* 預篩：只用行情端點就有的欄位排序深掃佇列，把額度先花在最可能有異動的幣上 */
  const preScored = useMemo(() => {
    if (!base.length) return base;
    const t = pctRank(base.map(r => r.turn));
    const v = pctRank(base.map(r => r.vol));
    const m = pctRank(base.map(r => Math.abs(r.m24 ?? 0)));
    const w = pctRank(base.map(r => Math.abs(r.m7 ?? 0)));
    return base.map((r, i) => ({
      ...r,
      pre: 0.4 * t[i] + 0.2 * v[i] + 0.25 * m[i] + 0.15 * w[i]
    }));
  }, [base]);
  const activeScans = source === "demo" ? demoScans || {} : scans;
  const rows = useMemo(() => {
    const cut = Date.now() - scanTTL * 3600000;
    return preScored.map(r => {
      const o = analyze(r, activeScans[r.id]);
      o.stale = o.scanTs != null && o.scanTs < cut;
      return o;
    });
  }, [preScored, activeScans, scanTTL]);

  /* ── Telegram 配對 ── */
  const tgCall = useCallback(async (path, body) => {
    const r = await fetch(path, {
      method: body ? "POST" : "GET",
      headers: {
        "Content-Type": "application/json"
      },
      body: body ? JSON.stringify(body) : undefined
    });
    return r.json();
  }, []);
  const tgRefresh = useCallback(async () => {
    try {
      setTg(await tgCall("/api/tg/status"));
    } catch (e) {
      setTg(null);
    }
  }, [tgCall]);
  useEffect(() => {
    if (local) tgRefresh();
  }, [local, tgRefresh]);
  const tgSetup = useCallback(async () => {
    setTgMsg(null);
    const j = await tgCall("/api/tg/setup", {
      token: tgToken.trim(),
      admin: tgAdmin.trim()
    });
    if (j.ok) {
      setTgToken("");
      setTgMsg(["ok", `已連上機器人 @${j.bot}`]);
      tgRefresh();
    } else setTgMsg(["err", j.error === "invalid_token" ? "這組 Token 無效，請確認是從 @BotFather 複製的完整字串" : j.error === "admin_key_required" ? "需要管理金鑰才能修改" : "設定失敗：" + (j.detail || j.error)]);
  }, [tgToken, tgAdmin, tgCall, tgRefresh]);
  const startPair = useCallback(async () => {
    setTgMsg(null);
    const j = await tgCall("/api/tg/pair", {});
    if (j.error) {
      setTgMsg(["err", "請先設定 Bot Token"]);
      return;
    }
    setPair({
      ...j,
      state: "waiting"
    });
  }, [tgCall]);
  useEffect(() => {
    if (!pair || pair.state !== "waiting") return;
    const t = setInterval(async () => {
      try {
        const j = await tgCall("/api/tg/pair/status", {
          code: pair.code
        });
        if (j.state === "paired") {
          setPair({
            ...pair,
            state: "paired",
            chat: j.chat
          });
          tgRefresh();
        } else if (j.state === "expired") setPair({
          ...pair,
          state: "expired"
        });else setPair(p => p ? {
          ...p,
          left: j.left
        } : p);
      } catch (e) {/* 忽略單次失敗 */}
    }, 3000);
    return () => clearInterval(t);
  }, [pair, tgCall, tgRefresh]);

  /* ── 伺服器背景監控 ── */
  const monRefresh = useCallback(async () => {
    try {
      setMon(await tgCall("/api/monitor/status"));
    } catch (e) {
      setMon(null);
    }
  }, [tgCall]);
  const monHistory = useCallback(async () => {
    try {
      const j = await tgCall("/api/monitor/history");
      setSrvHistory(j.history || []);
    } catch (e) {
      setSrvHistory([]);
    }
  }, [tgCall]);
  useEffect(() => {
    if (!local) return;
    monRefresh();
    monHistory();
    const t = setInterval(() => {
      monRefresh();
      monHistory();
    }, 60000);
    return () => clearInterval(t);
  }, [local, monRefresh, monHistory]);
  const monSync = useCallback(async on => {
    setMonMsg(null);
    const j = await tgCall("/api/monitor/config", {
      watch,
      scope: monScope,
      topN: monTopN,
      cfg: {
        bull: alertCfg.bull,
        bear: alertCfg.bear,
        cooldownMin: alertCfg.cooldownMin,
        minDelta: alertCfg.minDelta,
        breakoutPct: alertCfg.breakoutPct
      },
      on,
      admin: tgAdmin.trim()
    });
    if (j.ok) {
      setMonMsg(["ok", on ? `已同步並啟動，監控範圍：${j.scope === "top" ? `市值前 ${j.topN} 檔` : `觀察清單 ${j.watch} 檔`}` : "已停止背景監控"]);
      monRefresh();
    } else setMonMsg(["err", j.error === "admin_key_required" ? "管理金鑰不正確或未填。請在下方欄位輸入 Zeabur 環境變數 ADMIN_KEY 的值。" : "同步失敗：" + j.error]);
  }, [watch, alertCfg, tgAdmin, tgCall, monRefresh, monScope, monTopN]);

  /* ── 訊號評估：資料一更新就跑，狀態機負責去重 ── */
  const engineRef = useRef({});
  engineRef.current = {
